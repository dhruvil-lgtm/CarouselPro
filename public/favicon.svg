<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#bg)" stroke="url(#accent)" stroke-width="1.5"/>
  <!-- Layered square icon representing carousel slides -->
  <rect x="7" y="9" width="18" height="14" rx="2" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.5"/>
  <rect x="9" y="11" width="14" height="10" rx="1.5" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.75"/>
  <!-- Center accent square -->
  <rect x="11" y="12.5" width="10" height="7" rx="1" fill="url(#accent)" opacity="0.9"/>
  <!-- "P" letter for Pro with system font fallback -->
  <text x="16" y="18.5" font-family="Inter, Arial, Helvetica, sans-serif" font-size="8" font-weight="800" text-anchor="middle" fill="#0A0A0A">P</text>
</svg>
